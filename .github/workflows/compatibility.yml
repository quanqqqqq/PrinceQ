name: Platform compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: python -m unittest discover -s tests/python -p "test_*.py"
      - run: python skill/scripts/test_pwq_client_settings.py
      - run: python skill/scripts/test_pwq_client_merge.py
